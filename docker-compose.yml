version: '3.8'

services:

  # Aplikasi PHP Laravel
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: sim_iku_app
    restart: unless-stopped
    working_dir: /var/www
    volumes:
      - .:/var/www
    networks:
      - sim_iku_network

  # Web Server Nginx
  nginx:
    image: nginx:alpine
    container_name: sim_iku_nginx
    restart: unless-stopped
    ports:
      - "8080:80"           # Akses via http://localhost:8080
    volumes:
      - .:/var/www
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    networks:
      - sim_iku_network

  # Database MySQL
  db:
    image: mysql:8.0
    container_name: sim_iku_db
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: sim_iku          # Nama database
      MYSQL_ROOT_PASSWORD: secret123   # Password root
      MYSQL_PASSWORD: secret123        # Password user
      MYSQL_USER: sim_user             # Username
    ports:
      - "3307:3306"   # Port 3307 di komputer → 3306 di Docker
    volumes:
      - db_data:/var/lib/mysql
    networks:
      - sim_iku_network

  # phpMyAdmin (untuk akses database via browser)
  phpmyadmin:
    image: phpmyadmin/phpmyadmin
    container_name: sim_iku_phpmyadmin
    restart: unless-stopped
    ports:
      - "8081:80"           # Akses via http://localhost:8081
    environment:
      - PMA_HOST=db
      - PMA_PORT=3306
      - PMA_USER=sim_user
      - PMA_PASSWORD=secret123
      - UPLOAD_LIMIT=100M
    depends_on:
      - db
    networks:
      - sim_iku_network

networks:
  sim_iku_network:
    driver: bridge

volumes:
  db_data:
